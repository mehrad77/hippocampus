# CI for your PRIVATE vault repo (created by `hippo init` or the hosted app).
# - validate: checks that each push or pull request leaves the vault loadable. Pushes that only add
#   inbox memories skip it, and so do the app's own commits (they carry [skip ci]).
# - audit: once a day, reviews the last day's commits, the app's included, and flags any that break
#   the vault's rules (see AGENTS.md).
# Curation ("sleep") doesn't run here: your own agent does it through the Hippocampus MCP server.
name: validate
on:
  push:
    paths-ignore: ["inbox/**"]
  pull_request:
    paths-ignore: ["inbox/**"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Pin the major version you've tested; bump it deliberately and run `hippo migrate`.
      - run: npx -y @mehrad77/hippocampus@0 validate

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A little overlap with the previous run, since scheduled runs can start late.
      - run: npx -y @mehrad77/hippocampus@0 audit --since "26 hours ago"
