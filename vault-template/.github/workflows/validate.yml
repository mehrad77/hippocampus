# CI for your PRIVATE vault repo (copied here by `hippo init`).
# Checks that every push (yours, or an agent's inbox commit) leaves the vault loadable.
name: validate
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Pin the major version you've tested; bump it deliberately and run `hippo migrate`.
      - run: npx -y @mehrad77/hippocampus@0 validate

  # Optional: nightly sleep in CI with a HOSTED model (a runner can't reach your local LM Studio).
  # Add HIPPO_LLM_PROVIDER / HIPPO_LLM_MODEL as repo variables and the API key as a repo secret,
  # then uncomment. The job commits the consolidated vault back to this repo.
