# Hippocampus vault configuration.
version: 2

# What this memory is about (shown in the Handbook).
name: lisbon-arc

# IANA timezone for chronicle days/times.
timezone: Europe/Lisbon

# The humans this memory belongs to; the first is the primary one. Their word outranks every agent,
# and `ruling:` in disputes is theirs. A human's `domains` rank them above the other humans there.
# `github:` (or `gitlab:`, for a vault on GitLab) is their login there, so the hosted dashboard knows who signed in.
humans:
  - { id: player }

# Domains are the tags that define lanes. An agent is authoritative for entities tagged with
# one of its `authority` domains (party/<agent>.md); elsewhere its reports start as rumors.
domains: [residency, insurance, university, language, housing, career, finance, health, story]

# Entity types are notes in _hippo/schema/types/ (one per type: folder, fields, description), and
# episode kinds are notes in _hippo/schema/kinds/.

# Relation vocabulary the curator may use between entities.
relations: [member_of, part_of, located_in, owns, handles, requires, blocks, involves, works_at, knows, related_to]

curator:
  canon_threshold: 2      # distinct agents needed to promote a rumor to canon
  batch_size: 25          # max episodes per sleep
  summaries: true         # maintain an LLM summary paragraph per touched note
  stale_after_days: 60    # canon not re-confirmed for this long shows up in the morning review

secrets:
  # age public key; set by `hippo secrets keygen`. The private identity never enters the vault.
  recipient: null
